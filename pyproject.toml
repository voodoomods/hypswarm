[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "hypswarm"
version = "0.1.0a2"
description = "Run one agent or a swarm on a research or building task, with a HypGraph record as the only shared state."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Nicolas Houghtaling" }, { name = "VoodooMods LLC" }]
maintainers = [{ name = "VoodooMods LLC" }]
keywords = ["agents", "multi-agent", "research", "hypgraph", "orchestration", "swarm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = ["hypgraph>=0.4.2", "httpx>=0.27"]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
langchain = ["langchain-core>=0.3"]
langgraph = ["langchain-core>=0.3", "langgraph>=0.2"]
pydantic-ai = ["pydantic-ai-slim>=0.4"]
crewai = ["crewai>=1.15"]            # custom BaseLLMs return native tool calls from 1.15 on
bedrock = ["boto3>=1.34"]
mcp = ["fastmcp>=3.0"]
dev = ["pytest>=8", "mypy>=1.10", "ruff>=0.5"]

[project.urls]
Homepage = "https://hypswarm.com"
Source = "https://github.com/voodoomods/hypswarm"
Record = "https://hypgraph.com"

[project.scripts]
hypswarm = "hypswarm.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/hypswarm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["hypswarm"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["hypgraph", "hypgraph.*", "fastmcp", "fastmcp.*", "anthropic", "anthropic.*", "boto3", "boto3.*", "langchain_core", "langchain_core.*", "pydantic_ai", "pydantic_ai.*", "crewai", "crewai.*"]
follow_imports = "skip"            # hypgraph ships no py.typed yet: its surface is Any here
ignore_missing_imports = true

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint.isort]
known-third-party = ["hypgraph", "httpx", "fastmcp", "anthropic"]   # CI checks hypgraph out beside src/, which would
known-first-party = ["hypswarm"]                                      # otherwise make it look first-party there

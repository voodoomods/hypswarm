[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "hypswarm"
version = "0.0.1"
description = "Run one agent or a swarm of them on a task, with a HypGraph record as the only shared state. This release reserves the name; the alpha is on GitHub."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Nicolas Houghtaling" }, { name = "VoodooMods LLC" }]
maintainers = [{ name = "VoodooMods LLC" }]
keywords = ["agents", "multi-agent", "research", "hypgraph", "orchestration", "swarm"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://hypswarm.com"
Source = "https://github.com/voodoomods/hypswarm"
Record = "https://hypgraph.com"

[project.scripts]
hypswarm = "hypswarm.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/hypswarm"]

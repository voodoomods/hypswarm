name: ci
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true                 # a new push cancels a run that is still going (or hung)
jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    env:
      CI: "1"
      PYTHONUNBUFFERED: "1"
      PYDANTIC_AI_NO_BANNER: "1"
      CREWAI_TRACING_ENABLED: "false"       # CrewAI's telemetry and tracing threads must not outlive a test
      CREWAI_DISABLE_TELEMETRY: "true"
      OTEL_SDK_DISABLED: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # hypgraph comes from PyPI (>= 0.4.2, the coordination layer); the bridges' frameworks so their tests run
      - run: pip install -e ".[dev,anthropic,bedrock,langgraph,pydantic-ai,crewai]" "mypy==2.4.0" "ruff==0.17.2" fastmcp
      - run: python -m ruff check src tests examples --output-format=github
      - run: python -m mypy --strict src/hypswarm
      # -v names the test that is running; a test past 300 s fails with every thread's stack, not a silent hang
      - run: python -m pytest -v --timeout=300 --timeout-method=thread -o faulthandler_timeout=280
      # the examples, on scripted models (no spend); 06 exercises every bridge, 08 serves a record, 09 resumes
      - run: |
          set -e
          for d in 01-eval-report 02-software-tests 03-paper-trading 04-sourced-brief 05-optimal-with-bound 06-mixed-swarm 09-resume-and-notice 10-custom-seat-and-toolkit; do
            (cd "examples/$d" && timeout 600 python run.py --fresh --quiet --budget-calls 60)
          done
          (cd examples/07-human-reviewer && timeout 600 python run.py --fresh --quiet --auto)
          (cd examples/08-served-record && timeout 600 python run.py --fresh --quiet)
        shell: bash

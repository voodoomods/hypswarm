name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: voodoomods/hypgraph
          ref: harmony-study            # the coordination layer lives here until it merges and releases
          path: hypgraph
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]" --no-deps && pip install httpx pytest "mypy==2.4.0" "ruff==0.17.2" fastmcp anthropic
      - run: python -c "import subprocess,sys;p=subprocess.run([sys.executable,'-m','ruff','check','src','tests'],capture_output=True,text=True);out=(p.stdout+p.stderr).strip();print(out);print('::error::ruff exit %d: %s'%(p.returncode,out.replace(chr(10),' | ')[:3000])) if p.returncode else None;sys.exit(p.returncode)"
      - run: python -m mypy --strict src/hypswarm
        env:
          MYPYPATH: ${{ github.workspace }}/hypgraph/src
      - run: python -m pytest -q
        env:
          HYPGRAPH_SRC: ${{ github.workspace }}/hypgraph/src

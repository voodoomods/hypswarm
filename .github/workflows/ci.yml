name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: voodoomods/hypgraph
          ref: main
          path: hypgraph
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]" --no-deps && pip install httpx pytest mypy ruff fastmcp anthropic
      - run: python -m ruff check src tests
      - run: python -m mypy --strict src/hypswarm
        env:
          MYPYPATH: ${{ github.workspace }}/hypgraph/src
      - run: python -m pytest -q
        env:
          HYPGRAPH_SRC: ${{ github.workspace }}/hypgraph/src

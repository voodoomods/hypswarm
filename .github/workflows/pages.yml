# hypswarm.com: build the homepage's record and the app copy, then publish site/ to GitHub Pages on every push to main
# (the record measures the code, so a code change is a site change).
name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      # the homepage's own record: measured, re-measured, and the page's text checked against it (fails the deploy
      # on a copy error)
      - run: python dev/site_record.py
      # the HypGraph UI from the released hypgraph, and no root-absolute paths (the site also works under /hypswarm/)
      - run: python dev/build_site.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4

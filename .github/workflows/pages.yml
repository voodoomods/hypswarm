# hypswarm.com: publish site/ to GitHub Pages. Runs on push to main once Pages is enabled for the repository
# (Settings → Pages → Source: GitHub Actions) and the domain's DNS points at GitHub, as hypgraph.com's does.
name: pages
on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: python -c "import re,sys;s=open('site/index.html').read();bad=re.findall(r'(?:href|src)=\"/(?!/)',s);sys.exit('root-absolute paths: %d'%len(bad) if bad else 0)"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
